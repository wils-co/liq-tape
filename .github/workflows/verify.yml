# The doctrine walls, run by a machine. Every wall here was previously a thing
# a reviewer had to remember to check; PR4 merged without review on 2026-09-12
# and nothing caught it, because the gate was a person.
#
# Stdlib-only project, so this costs nothing to run: no pip install, no
# requirements, no third-party actions beyond checkout and setup-python.
name: verify

on:
  pull_request:
  push:
    branches: [main]

# Read the code, report a status. Nothing here needs more than that.
permissions:
  contents: read

jobs:
  walls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Doctrine walls
        run: |
          set -euo pipefail

          # NOT "! grep ...": bash never applies set -e to a negated command,
          # so a wall written that way passes whether or not it finds anything.
          # deny() checks the exit status itself, prints what it found, and
          # keeps going so one run reports every violation rather than the
          # first.
          fail=0
          deny () {
            local why="$1"; shift
            local out rc=0
            # "|| rc=$?" both captures the status and keeps set -e out of it.
            # rc 1 is a clean wall; rc 2+ means grep itself failed (bad regex,
            # missing or unreadable file) and must fail loudly — a renamed file
            # silently disabling a check is the dishonesty this file exists to
            # prevent.
            out=$(grep "$@" 2>/dev/null) || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "WALL BREACHED: $why"
              printf '%s\n' "$out" | sed 's/^/    /'
              fail=1
            elif [ "$rc" -ge 2 ]; then
              echo "WALL ERROR (grep rc=$rc): $why"
              fail=1
            fi
          }

          # No order path, no reaching into the desk or the harness.
          deny "order path or desk/harness import" \
            -rnE "Exchange|\b(from|import)[[:space:]]+(harness|desk)\b" --include="*.py" --include="*.sh" .

          # No credentials of any kind in the code that runs. This one has no
          # escape hatch: it passes honestly today, so it stays a real check.
          deny "credential-shaped name in code" \
            -rniE "api[_-]?key|secret|password|token" --include="*.py" --include="*.sh" .

          # Loopback only.
          deny "non-loopback bind" -rnE "0\.0\.0\.0" --include="*.py" .

          # Signal language. Only these two words are grepped across the page
          # and the README: every other banned word has a legitimate non-copy
          # use here today (AbortController.signal, the "long flush" lens text,
          # a "short" local), so grepping them would need an escape hatch, and
          # an always-passing check is worse than an honest narrow one.
          deny "signal language in copy" \
            -rinE "support|resistance" index.html README.md levels.yaml

          # levels.yaml is pure data with no prose and no code, so the whole
          # banned vocabulary applies to it without exception.
          deny "signal language in levels.yaml" \
            -rinE "\b(buy|sell|long|short|signal|alert|support|resistance)\b" levels.yaml

          # Every colour comes from the token set, so dark mode cannot regress.
          deny "hardcoded colour in the SVG panels" \
            -nE 'fill="#[0-9a-fA-F]{3,8}"|stroke="#[0-9a-fA-F]{3,8}"' index.html

          # One self-contained page: no CDN, no external asset, works offline.
          deny "external asset reference" -nE '(src|href)="(https?:)?//' index.html

          # The server never writes a file. This is what keeps levels.yaml
          # human-edited: there is no write path for anything to reach it.
          deny "server writes to disk" -nE 'write_text|open\([^)]*"[wax]' server.py
          deny "server writes to disk" -nE "write_text|open\([^)]*'[wax]" server.py

          # The sampler has no business touching the levels file either.
          deny "sampler touching the levels file" -in "levels" sampler.py run_sampler.sh

          if [ "$fail" -ne 0 ]; then
            echo "walls: FAILED"
            exit 1
          fi
          echo "walls: clean"

      - name: Syntax gates
        run: |
          set -euo pipefail
          python3 -m py_compile sampler.py server.py scripts/check_levels.py
          bash -n run_sampler.sh
          echo "syntax: clean"

      - name: Levels file reads
        run: python3 scripts/check_levels.py

      - name: Server smoke test
        run: |
          set -euo pipefail

          # No data/ dir (gitignored) and no official client on the runner:
          # exactly the state a fresh clone is in, and both paths must serve.
          # oi_BTC.jsonl is enough to make BTC a known coin so a missing trades
          # file can be a 200 + note rather than collapsing into unknown_coin.
          TMPDATA="$RUNNER_TEMP/liqdata"
          mkdir -p "$TMPDATA"
          printf '%s\n' '{"ts": 1, "mark": 1, "oi": 1}' > "$TMPDATA/oi_BTC.jsonl"
          # ETH has a trades file and no oi file: tracked, but no mark path yet.
          printf '%s\n' '{"tid": 1, "time": 1, "px": "1", "sz": "1", "side": "B"}' > "$TMPDATA/trades_ETH.jsonl"

          python3 server.py --port 8791 --client /nonexistent/client.py --data-dir "$TMPDATA" &
          SPID=$!
          trap 'kill $SPID 2>/dev/null || true' EXIT
          sleep 3

          curl -sf -o /dev/null http://127.0.0.1:8791/
          curl -sf -o "$RUNNER_TEMP/levels.json" http://127.0.0.1:8791/api/levels

          # One line on purpose: inside a YAML block scalar every line carries
          # the block's indentation, which a multi-line python -c would read as
          # an indentation error.
          python3 -c "import json,sys; d=json.load(sys.stdin); assert not d['errors'], d['errors']; assert d['count'] > 0, 'no levels served'; print('levels endpoint:', d['count'], 'levels')" < "$RUNNER_TEMP/levels.json"

          # An untracked coin is a 404, not a fabricated empty panel.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/oi/DOGE)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/profile/DOGE)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/prints/DOGE)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/cvd/DOGE)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/marks/DOGE)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/liq/DOGE)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/nope)" = 404

          # Known coin, missing trades file: 200 + note, not 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/cvd/BTC)" = 200
          curl -sf -o "$RUNNER_TEMP/cvd.json" http://127.0.0.1:8791/api/cvd/BTC
          python3 -c "import json,sys; d=json.load(sys.stdin); assert d['sampled'] is True, d; assert d.get('note'), d; assert d['cvd']['latest'] is None, d; assert d['cvd']['series'] == [], d; print('cvd missing-file:', d['note'])" < "$RUNNER_TEMP/cvd.json"

          # Mark path: a missing oi file and a sub-2-point window are both
          # 200 + the veil note with no invented points.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/marks/ETH)" = 200
          curl -sf http://127.0.0.1:8791/api/marks/ETH | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['marks'] == [] and d['latest'] is None and d.get('note'), d; print('marks missing-file:', d['note'])"
          curl -sf http://127.0.0.1:8791/api/marks/BTC | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['marks']) < 2 and d.get('note'), d; print('marks young:', d['note'])"
          # Downsampling keeps each bucket's high and low and ends on the newest raw row.
          python3 -c "from server import _downsample_marks as ds; pts=[{'ts':float(i),'mark':100.0} for i in range(1200)]; pts[333]['mark']=150.0; pts[777]['mark']=50.0; out=ds(pts,480); assert len(out)<=481, len(out); ms=[p['mark'] for p in out]; assert 150.0 in ms and 50.0 in ms, 'extreme shaved'; assert out[-1] is pts[-1]; assert all(a['ts']<b['ts'] for a,b in zip(out,out[1:])); print('marks downsample: ok')"

          # Liq map: a tracked coin with no liq file (sampler older than the
          # board) is 200 + note with no invented clusters.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/api/liq/BTC)" = 200
          curl -sf http://127.0.0.1:8791/api/liq/BTC | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['clusters'] == [] and d['coverage'] is None and d['within_2pct'] is None and d.get('note'), d; print('liq missing-file:', d['note'])"
          # Clustering: 5 wallets → one BTC short cluster of 2 (0.1% apart), one
          # long singleton; the ETH row and the null-liq row are dropped.
          python3 -c "from server import cluster_liq; fx=[{'address':'0xA','coin':'BTC','szi':-2,'liquidation_px':100000.0,'position_value':2e5},{'address':'0xB','coin':'BTC','szi':-1,'liquidation_px':100100.0,'position_value':1e5},{'address':'0xC','coin':'BTC','szi':3,'liquidation_px':90000.0,'position_value':3e5},{'address':'0xD','coin':'ETH','szi':5,'liquidation_px':3000.0,'position_value':1.5e4},{'address':'0xE','coin':'BTC','szi':1,'liquidation_px':None,'position_value':1}]; c=cluster_liq(fx,'BTC'); assert len(c)==2, c; lo,hi=c; assert (lo['side'],lo['wallets'],lo['notional'])==('long',1,3e5), lo; assert (hi['side'],hi['wallets'],hi['positions'],hi['notional'])==('short',2,2,3e5), hi; assert abs(hi['px']-(1e5*2e5+100100*1e5)/3e5)<1e-3, hi; assert (hi['lo'],hi['hi'])==(100000.0,100100.0), hi; print('liq clusters: ok')"

          # Wall tagging is local (no client). 1.5x median, or 20% of the
          # side's visible notional. Restoring $1M / 4.0 fails both cases.
          python3 -c "from server import _tag_side_walls, WALL_MEDIAN_MULT, WALL_SHARE; assert WALL_MEDIAN_MULT==1.5 and WALL_SHARE==0.20; lv=[{'px':1.0,'sz':1e5} for _ in range(14)]+[{'px':1.0,'sz':2e5}]; t=_tag_side_walls(lv); assert t['median_1_5']==150000, t; assert lv[-1]['wall'] is True and all(not x['wall'] for x in lv[:-1]); print('walls 1.5x: ok')"
          python3 -c "from server import _tag_side_walls; lv=[{'px':1.0,'sz':1e5} for _ in range(4)]+[{'px':1.0,'sz':1.2e5}]; t=_tag_side_walls(lv); assert t['median_1_5']==150000, t; assert abs(t['share_20']-104000)<1e-6, t; assert lv[-1]['wall'] is True and all(not x['wall'] for x in lv[:-1]); print('walls share: ok')"

          echo "smoke: clean"
